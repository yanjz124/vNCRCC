<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">vNCRCC emblem</title>
  <defs>
    <path id="arcTop" d="M 30.5 125.3 A 74 74 0 1 1 169.5 125.3"/>
    <path id="arcBot" d="M 21 108 A 80 80 0 0 0 179 108"/>
    <clipPath id="inner"><circle cx="100" cy="100" r="57"/></clipPath>
  </defs>
  <!-- rims -->
  <circle cx="100" cy="100" r="99" fill="#c9a227"/>
  <circle cx="100" cy="100" r="95" fill="#0b3d78"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#c9a227" stroke-width="1"/>
  <!-- ring lettering -->
  <g fill="#fff" font-family="Lato, 'Segoe UI', Arial, sans-serif" font-weight="900" letter-spacing="1.1">
    <text font-size="11.5"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">VIRTUAL NATIONAL CAPITAL REGION</textPath></text>
    <text font-size="11.5"><textPath href="#arcBot" startOffset="50%" text-anchor="middle">COORDINATION CENTER</textPath></text>
  </g>
  <!-- separators -->
  <g fill="#c9a227">
    <polygon points="29.9,130.0 30.9,132.8 33.9,132.9 31.6,134.7 32.4,137.6 29.9,136.0 27.4,137.6 28.2,134.7 25.9,132.9 28.9,132.8"/>
    <polygon points="170.1,130.0 171.1,132.8 174.1,132.9 171.8,134.7 172.6,137.6 170.1,136.0 167.6,137.6 168.4,134.7 166.1,132.9 169.1,132.8"/>
  </g>
  <!-- inner field -->
  <circle cx="100" cy="100" r="60" fill="#c9a227"/>
  <circle cx="100" cy="100" r="57" fill="#112e51"/>
  <g clip-path="url(#inner)">
    <!-- sky gradient bands -->
    <rect x="40" y="40" width="120" height="120" fill="#123a6b"/>
    <rect x="40" y="118" width="120" height="42" fill="#0d2a4e"/>
    <!-- P-56 restricted ring -->
    <circle cx="100" cy="96" r="34" fill="none" stroke="#e5534b" stroke-width="2.4" stroke-dasharray="5 3"/>
    <!-- obelisk -->
    <polygon points="64,121 66.5,72 68.5,68 70.5,72 73,121" fill="#fff"/>
    <!-- Capitol: base, colonnade, drum, dome, lantern -->
    <g fill="#fff">
      <rect x="80" y="113" width="58" height="8"/>
      <rect x="84" y="107" width="50" height="6"/>
      <g fill="#123a6b">
        <rect x="88" y="108.5" width="2" height="4"/><rect x="93" y="108.5" width="2" height="4"/>
        <rect x="98" y="108.5" width="2" height="4"/><rect x="103" y="108.5" width="2" height="4"/>
        <rect x="113" y="108.5" width="2" height="4"/><rect x="118" y="108.5" width="2" height="4"/>
        <rect x="123" y="108.5" width="2" height="4"/><rect x="128" y="108.5" width="2" height="4"/>
      </g>
      <rect x="99" y="98" width="20" height="9"/>
      <path d="M97 98 Q109 72 121 98 Z"/>
      <rect x="107.5" y="80" width="3" height="5"/>
      <circle cx="109" cy="79" r="1.6"/>
    </g>
    <!-- aircraft crossing -->
    <g transform="translate(128 66) rotate(35)" fill="#ffbe2e">
      <path d="M0-9 C1.2-9 1.6-7 1.6-5 L1.6-1.5 9 3 9 5 1.6 2.6 1.6 6.5 4 8.5 4 10 0 8.8 -4 10 -4 8.5 -1.6 6.5 -1.6 2.6 -9 5 -9 3 -1.6-1.5 -1.6-5 C-1.6-7 -1.2-9 0-9Z"/>
    </g>
    <!-- ground line -->
    <rect x="40" y="121" width="120" height="1.5" fill="#c9a227"/>
  </g>
  <!-- monogram -->
  <text x="100" y="140" text-anchor="middle" fill="#c9a227" font-family="Lato, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="13" letter-spacing="2">vNCRCC</text>
</svg>
