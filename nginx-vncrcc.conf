# Exempt localhost from rate limiting
geo $limit {
    default $binary_remote_addr;
    127.0.0.1 "";
    ::1 "";
}

# Rate limiting zones
# NOTE: The live dashboard polls the API and opens a long-lived SSE stream, so
# the API zone must allow enough headroom for a normal viewing session (initial
# parallel page-load calls + periodic polling). 6r/m froze the live map.
limit_req_zone $limit zone=api_limit:10m rate=60r/m;
limit_req_zone $limit zone=static_limit:10m rate=30r/m;
limit_req_zone $limit zone=page_limit:10m rate=10r/m;

server {
    listen 80;
    server_name vncrcc.org www.vncrcc.org api.vncrcc.org;

    location /static/ {
        alias /var/www/html/web/static/;
        limit_req zone=static_limit burst=10 nodelay;
    }

    # Server-Sent Events stream for real-time dashboard updates.
    # MUST be declared before the generic /api/ block so it wins the match.
    # SSE requires: no response buffering (events must flush immediately),
    # HTTP/1.1 keep-alive to the upstream, no rate limiting (it is a single
    # long-lived connection), and a long read timeout.
    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for SSE: stream events through instead of buffering them.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep the stream open; it heartbeats every ~15s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Use keep-alive to the upstream so streamed/chunked responses flow.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        root /var/www/html/web;
        try_files $uri $uri/ /index.html;
        limit_req zone=page_limit burst=5 nodelay;
    }
}
